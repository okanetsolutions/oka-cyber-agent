name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: shellcheck
        run: shellcheck -s sh install.sh packaging/*.sh test/install/*.sh
      - name: install.sh unit matches packaging/oka-cyber-agent.service
        run: sh test/install/check-unit.sh
      - name: install.sh tells an old cosign from a bad signature
        run: sh test/install/cosign.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w -X github.com/okanetsolutions/oka-cyber-agent/internal/agent.Version=${GITHUB_SHA::12}" -o "oka-cyber-agent-linux-${GOARCH}" ./cmd/oka-cyber-agent
          file "oka-cyber-agent-linux-${GOARCH}" | tee /dev/stderr | grep -q 'statically linked'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oka-cyber-agent-linux-${{ matrix.goarch }}
          path: oka-cyber-agent-linux-${{ matrix.goarch }}
          retention-days: 7

  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [systemd-host, systemd-el8, "ubuntu:24.04", "debian:12", "rockylinux/rockylinux:9", "rockylinux/rockylinux:8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the release files and start the fake tenant
        run: sh test/install/prepare.sh /tmp/oka-install-test
      - name: Install, rerun and uninstall on the runner with systemd
        if: matrix.target == 'systemd-host'
        run: sudo sh test/install/run.sh
      - name: Install, rerun and uninstall under systemd 239 (RHEL 8, no LoadCredential)
        if: matrix.target == 'systemd-el8'
        run: sh test/install/systemd-container.sh registry.access.redhat.com/ubi8/ubi-init run.sh
      - name: Install, rerun and uninstall in ${{ matrix.target }}
        if: matrix.target != 'systemd-host' && matrix.target != 'systemd-el8'
        run: docker run --rm --network host -v "$PWD:/src:ro" "${{ matrix.target }}" sh /src/test/install/run.sh
      - name: Fake tenant log
        if: failure()
        run: cat /tmp/oka-install-test/faketenant.log

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom
      - name: Start the fake tenant
        run: sh test/install/prepare.sh /tmp/oka-install-test
      - name: Install, enroll, upgrade and remove the .deb and .rpm
        run: |
          for image in debian:12 ubuntu:24.04 rockylinux/rockylinux:9 rockylinux/rockylinux:8; do
            echo "::group::$image"
            docker run --rm --network host -v "$PWD/dist:/dist:ro" -v "$PWD:/src:ro" "$image" sh /src/test/install/packages.sh
            echo "::endgroup::"
          done
      - name: The .deb under systemd on the runner (remove and reinstall)
        run: sudo DIST="$PWD/dist" sh test/install/packages.sh
      - name: The .rpm under systemd 239 (RHEL 8, no LoadCredential)
        run: sh test/install/systemd-container.sh registry.access.redhat.com/ubi8/ubi-init packages.sh
      - name: Fake tenant log
        if: failure()
        run: cat /tmp/oka-install-test/faketenant.log
